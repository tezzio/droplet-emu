# Tests the server, then (on the server branch) builds its Docker image into this project's
# container registry: registry.gitlab.com/seighttt/droplet/reservoir
stages:
  - test
  - build

test:
  stage: test
  image: python:3.13-alpine
  script:
    # Quoted, or YAML takes the ": " after :all for a key.
    - 'pip install --no-cache-dir --only-binary=:all: -r requirements.txt'
    - python -I tests/test_server.py

docker-image:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: $CI_REGISTRY_IMAGE/reservoir
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "server"
